[workspace]
resolver = "2"
members = ["core", "gui"]

[workspace.package]
version = "0.2.9"
edition = "2021"
license = "MIT OR Apache-2.0"
repository = "https://github.com/ConociendoAlmasMenosHastiadas/forma-fractalis"

[workspace.dependencies]
scala-chromatica = "0.1.4"
rayon = "1.12"
astro-float = "0.9"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
num-complex = "0.4"
image = "0.25"
png = "0.18"
tempfile = "3.27"

[profile.release]
strip = true  # Remove symbol/debug info from binary

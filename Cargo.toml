[package]
name = "forma-fractalis"
version = "0.1.7"
edition = "2021"

[dependencies]
scala-chromatica = { git = "https://github.com/ConociendoAlmasMenosHastiadas/scala-chromatica.git" }
rayon = "1.8"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
once_cell = "1.19"
eframe = "0.25"  # egui framework
directories = "5.0"  # Platform-specific config directories
image = "0.24"  # Image encoding/decoding for PNG export
png = "0.17"  # PNG encoder with metadata support
rfd = "0.12"  # Cross-platform file dialogs
num-complex = "0.4"  # Complex number arithmetic for fractals
clap = { version = "4.4", features = ["derive"] }  # Command-line argument parsing
indicatif = "0.17"  # Progress bars for CLI rendering

# Windows-specific dependencies
[target.'cfg(windows)'.dependencies]
winapi = { version = "0.3", features = ["winuser", "windef"] }

[dev-dependencies]
tempfile = "3.8"  # Temporary files for integration tests

[[bench]]
name = "fractal_bench"
harness = false
